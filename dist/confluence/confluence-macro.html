<div id="ocvs-sizer"><div style="padding:24px;font-family:Arial,sans-serif;color:#6b778c">Loading the VMware sizing tool…</div></div>
<script>
(function () {
  // Loads ocvs-sizer-tool.js attached to this page and runs it inline.
  var meta = function (n) { var m = document.querySelector('meta[name="' + n + '"]'); return m ? m.content : ""; };
  var ctx = meta("ajs-context-path"), pageId = meta("ajs-page-id") || (window.AJS && AJS.params && AJS.params.pageId);
  var url = ctx + "/download/attachments/" + pageId + "/ocvs-sizer-tool.js?api=v2&t=" + Math.floor(Date.now() / 600000);
  fetch(url, { credentials: "same-origin" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (code) { var s = document.createElement("script"); s.textContent = code; document.body.appendChild(s); })
    .catch(function (e) {
      document.getElementById("ocvs-sizer").innerHTML = '<div style="padding:20px;border:1px solid #f5c2c0;background:#fdecea;border-radius:10px;font-family:Arial,sans-serif;color:#8a1c14">' +
        'Could not load the sizing tool (' + e.message + '). Check that <b>ocvs-sizer-tool.js</b> is attached to this page.</div>';
    });
})();
</script>
